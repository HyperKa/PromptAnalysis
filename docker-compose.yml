version: '3.8'

services:
  # менеджер kafka:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # брокер сообщений:
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      # проброс на порт
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      # 29092 - адрес внутри системы Docker
      # порт 9092 как внешний интерфейс для обращения к порту Docker
      # разделение имен слушателей на INTERNAL и EXTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # словарь адресов
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      # прослушивание на двух портах...
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # указание на общение брокеров меж собой
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

  # SPRING BOOT APP
  route-app:
    container_name: route-app
    # сборка образа
    build: .
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      # передача адреса кафки в приложение
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # настройка ключа для модели LLM
      SPRING_AI_MISTRALAI_API_KEY: ${SPRING_AI_MISTRALAI_API_KEY}
